<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUHI PERFUMES — Admin Panel & Product Management</title>
  <meta name="theme-color" content="#080706">
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --obsidian: #080706;
      --soft-black: #11100E;
      --card-bg: #161412;
      --gold-primary: #C7A46A;
      --gold-light: #DFBF8B;
      --ivory: #F4EFE5;
      --cream-muted: #A99B89;
      --border-muted: rgba(244, 239, 229, 0.12);
      --border-gold: rgba(199, 164, 106, 0.3);
      --accent-green: #25D366;
      --accent-red: #E74C3C;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--obsidian);
      color: var(--ivory);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font-family: inherit; }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .toast {
      background-color: var(--card-bg);
      border: 1px solid var(--border-gold);
      color: var(--ivory);
      padding: 1rem 1.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Login Screen */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at center, rgba(138, 79, 36, 0.12) 0%, var(--obsidian) 70%);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-gold);
      padding: 3rem 2.5rem;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      text-align: center;
    }

    .login-brand {
      font-family: var(--font-serif);
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      color: var(--gold-light);
      margin-bottom: 0.25rem;
    }

    .login-sub {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--cream-muted);
      margin-bottom: 2.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-primary);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: rgba(8, 7, 6, 0.7);
      border: 1px solid var(--border-muted);
      color: var(--ivory);
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--gold-primary);
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--gold-primary);
      color: var(--obsidian);
      box-shadow: 0 10px 25px rgba(199, 164, 106, 0.25);
    }

    /* Admin Dashboard Layout */
    .dashboard-container {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .admin-header {
      background-color: var(--soft-black);
      border-bottom: 1px solid var(--border-muted);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      letter-spacing: 0.25em;
      color: var(--gold-light);
    }

    .header-tag {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      background: rgba(199, 164, 106, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      text-transform: uppercase;
      margin-left: 0.75rem;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border-muted);
      color: var(--cream-muted);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      padding: 0.5rem 1rem;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* Content Main */
    .admin-main {
      padding: 2.5rem 2rem;
      max-width: 1360px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-muted);
      padding: 1.5rem;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-val {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      color: var(--gold-light);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--cream-muted);
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--ivory);
    }

    .btn-add {
      background: var(--gold-primary);
      color: var(--obsidian);
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-add:hover {
      background: var(--gold-light);
      box-shadow: 0 8px 25px rgba(199, 164, 106, 0.3);
    }

    /* Product Table */
    .table-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-muted);
      border-radius: 6px;
      overflow-x: auto;
    }

    .product-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .product-table th {
      background-color: var(--soft-black);
      color: var(--gold-primary);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border-muted);
    }

    .product-table td {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border-muted);
      vertical-align: middle;
    }

    .product-table tr:last-child td { border-bottom: none; }

    .product-table tr:hover {
      background-color: rgba(244, 239, 229, 0.02);
    }

    .thumb-img {
      width: 60px;
      height: 75px;
      object-fit: contain;
      background: #FFFFFF;
      border: 1px solid var(--border-gold);
      border-radius: 4px;
      padding: 4px;
    }

    .badge-status {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 3px;
      font-weight: 600;
    }

    .badge-active {
      background: rgba(37, 211, 102, 0.15);
      color: #25D366;
      border: 1px solid rgba(37, 211, 102, 0.3);
    }

    .badge-inactive {
      background: rgba(231, 76, 60, 0.15);
      color: #E74C3C;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border-muted);
      color: var(--ivory);
      padding: 0.45rem 0.85rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      margin-right: 0.5rem;
    }

    .btn-action.btn-edit:hover {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    .btn-action.btn-delete:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 7, 6, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-gold);
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2.5rem;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      position: relative;
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      color: var(--gold-light);
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-muted);
      padding-bottom: 0.75rem;
    }

    .modal-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .modal-grid-2 { grid-template-columns: 1fr; }
    }

    .img-preview-box {
      width: 120px;
      height: 150px;
      border: 1px dashed var(--border-gold);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .img-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
      border-top: 1px solid var(--border-muted);
      padding-top: 1.5rem;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border-muted);
      color: var(--cream-muted);
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- 1. LOGIN VIEW -->
  <div class="login-container" id="loginView">
    <div class="login-card">
      <div class="login-brand">RUHI</div>
      <div class="login-sub">ADMIN PORTAL</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">ADMIN USERNAME</label>
          <input type="text" id="username" class="form-input" placeholder="Enter admin username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">ADMIN PASSWORD</label>
          <input type="password" id="password" class="form-input" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">LOG IN TO DASHBOARD</button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD VIEW -->
  <div class="dashboard-container" id="dashboardView">
    <header class="admin-header">
      <div style="display:flex; align-items:center;">
        <span class="header-logo">RUHI</span>
        <span class="header-tag">ADMIN MANAGEMENT</span>
      </div>
      <div class="header-right">
        <a href="/" target="_blank" style="font-size:0.75rem; color:var(--gold-primary); letter-spacing:0.1em;">VIEW PUBLIC SITE ↗</a>
        <button class="btn-logout" onclick="handleLogout()">LOGOUT</button>
      </div>
    </header>

    <main class="admin-main">
      <!-- Stats Row -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="statTotal">0</div>
          <div class="stat-label">TOTAL PRODUCTS</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statActive">0</div>
          <div class="stat-label">ACTIVE ON WEBSITE</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statHidden">0</div>
          <div class="stat-label">HIDDEN PRODUCTS</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statCloudinary">0</div>
          <div class="stat-label">CLOUDINARY IMAGES</div>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <h2 class="section-title">PERFUME COLLECTION</h2>
        <button class="btn-add" onclick="openAddModal()">+ ADD NEW PRODUCT</button>
      </div>

      <!-- Table Container -->
      <div class="table-container">
        <table class="product-table">
          <thead>
            <tr>
              <th>IMAGE</th>
              <th>NAME & FAMILY</th>
              <th>SIZE / ML</th>
              <th>ORDER</th>
              <th>STATUS</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Dynamic Product Rows Rendered via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- 3. ADD / EDIT PRODUCT MODAL -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <h3 class="modal-title" id="modalHeading">ADD NEW PERFUME</h3>

      <form id="productForm" onsubmit="handleSaveProduct(event)">
        <input type="hidden" id="productId">

        <div class="modal-grid-2">
          <div class="form-group">
            <label class="form-label" for="productName">PRODUCT NAME *</label>
            <input type="text" id="productName" class="form-input" placeholder="e.g. RUHI VANTA" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="sizeML">PRODUCT SIZE / ML * (MANUALLY ENTERABLE)</label>
            <input type="text" id="sizeML" class="form-input" placeholder="e.g. 8ML, 50ML, 100ML" required>
          </div>
        </div>

        <div class="modal-grid-2">
          <div class="form-group">
            <label class="form-label" for="family">FRAGRANCE FAMILY</label>
            <input type="text" id="family" class="form-input" placeholder="e.g. AMBER LEATHER">
          </div>

          <div class="form-group">
            <label class="form-label" for="personality">PERSONALITY TAG</label>
            <input type="text" id="personality" class="form-input" placeholder="e.g. Deep • Dark • Sophisticated">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">SHORT DESCRIPTION *</label>
          <textarea id="description" class="form-textarea" rows="3" placeholder="Enter perfume description..." required></textarea>
        </div>

        <div class="modal-grid-2">
          <div class="form-group">
            <label class="form-label" for="displayOrder">DISPLAY ORDER</label>
            <input type="number" id="displayOrder" class="form-input" value="1" min="1">
          </div>

          <div class="form-group">
            <label class="form-label" for="isActive">VISIBILITY STATUS</label>
            <select id="isActive" class="form-select">
              <option value="true">ACTIVE (VISIBLE ON PUBLIC SITE)</option>
              <option value="false">INACTIVE (HIDDEN)</option>
            </select>
          </div>
        </div>

        <!-- Notes Pyramid -->
        <div style="border: 1px dashed var(--border-muted); padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
          <span class="form-label" style="display:block; margin-bottom:0.75rem;">FRAGRANCE NOTES PYRAMID (OPTIONAL)</span>
          <div class="form-group">
            <input type="text" id="noteTop" class="form-input" placeholder="Top Notes (e.g. Smoked Cardamom, Black Pepper)">
          </div>
          <div class="form-group">
            <input type="text" id="noteHeart" class="form-input" placeholder="Heart Notes (e.g. Black Leather, Cypress)">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <input type="text" id="noteBase" class="form-input" placeholder="Base Notes (e.g. Dark Amber, Haitian Vetiver)">
          </div>
        </div>

        <!-- Image Upload Section -->
        <div class="form-group">
          <label class="form-label">PRODUCT IMAGE (CLOUDINARY)</label>
          <input type="file" id="imageFileInput" accept="image/*" class="form-input" onchange="previewSelectedImage(event)">
          <input type="hidden" id="imageUrl">
          <input type="hidden" id="cloudinaryPublicId">

          <div class="img-preview-box" id="previewBox">
            <span style="font-size:0.7rem; color:var(--cream-muted);">NO IMAGE</span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeProductModal()">CANCEL</button>
          <button type="submit" class="btn-submit" id="saveProductBtn" style="width:auto; padding:0.75rem 2rem; margin-top:0;">SAVE PRODUCT</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. DELETE CONFIRMATION MODAL -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card" style="max-width:450px; text-align:center;">
      <h3 class="modal-title" style="color:var(--accent-red); border:none; padding:0; margin-bottom:1rem;">DELETE PRODUCT</h3>
      <p id="deleteConfirmText" style="color:var(--warm-cream); margin-bottom:2rem; font-size:0.95rem;"></p>
      
      <div style="display:flex; gap:1rem; justify-content:center;">
        <button class="btn-cancel" onclick="closeDeleteModal()">CANCEL</button>
        <button class="btn-submit" style="background:var(--accent-red); border-color:var(--accent-red); color:white; width:auto; padding:0.75rem 2rem; margin-top:0;" onclick="confirmDeleteProduct()">PERMANENTLY DELETE</button>
      </div>
    </div>
  </div>

  <script>
    let productsData = [];
    let pendingDeleteId = null;
    let selectedBase64Image = null;

    // Toast Utility
    function showToast(message, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      if (isError) toast.style.borderColor = 'var(--accent-red)';
      toast.innerHTML = `<span>${isError ? '⚠️' : '✓'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    // Check Auth Status on Load
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/auth?action=check');
        const data = await res.json();
        if (data.authenticated) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch (err) {
        showLogin();
      }
    });

    function showLogin() {
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('dashboardView').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'flex';
      loadAdminProducts();
    }

    // Handle Login
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.textContent = 'AUTHENTICATING...';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showToast('Authentication successful!');
          showDashboard();
        } else {
          showToast(data.error || 'Invalid credentials.', true);
        }
      } catch (err) {
        showToast('Login request failed.', true);
      } finally {
        loginBtn.textContent = 'LOG IN TO DASHBOARD';
        loginBtn.disabled = false;
      }
    }

    // Handle Logout
    async function handleLogout() {
      try {
        await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'logout' })
        });
        showToast('Logged out successfully.');
        showLogin();
      } catch (err) {
        showLogin();
      }
    }

    // Load Products from API
    async function loadAdminProducts() {
      try {
        const res = await fetch('/api/products?admin=true');
        if (!res.ok) {
          if (res.status === 401) {
            showToast('Session expired. Please log in.', true);
            showLogin();
            return;
          }
        }
        productsData = await res.json();
        renderTable();
        updateStats();
      } catch (err) {
        showToast('Failed to load products.', true);
      }
    }

    // Render Table
    function renderTable() {
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';

      if (productsData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:3rem; color:var(--cream-muted);">No products found. Click "+ ADD NEW PRODUCT" to add your first perfume.</td></tr>`;
        return;
      }

      productsData.forEach(p => {
        const tr = document.createElement('tr');
        const imgUrl = p.imageUrl || 'assets/hd/bottle_01.png';
        const isActive = p.isActive !== false;

        tr.innerHTML = `
          <td><img src="${imgUrl}" alt="${p.productName}" class="thumb-img"></td>
          <td>
            <div style="font-weight:600; color:var(--ivory);">${p.productName}</div>
            <div style="font-size:0.75rem; color:var(--gold-primary);">${p.family || ''}</div>
          </td>
          <td><span style="background:rgba(244,239,229,0.06); padding:0.25rem 0.6rem; border-radius:3px; font-weight:600;">${p.sizeML || '8ML'}</span></td>
          <td><span style="font-family:var(--font-serif); font-size:1.2rem; color:var(--gold-light);">${String(p.displayOrder || 1).padStart(2, '0')}</span></td>
          <td>
            <span class="badge-status ${isActive ? 'badge-active' : 'badge-inactive'}">
              ${isActive ? 'ACTIVE' : 'HIDDEN'}
            </span>
          </td>
          <td>
            <button class="btn-action btn-edit" onclick="openEditModal('${p._id}')">EDIT</button>
            <button class="btn-action btn-delete" onclick="openDeleteModal('${p._id}', '${p.productName}')">DELETE</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Update Dashboard Stats
    function updateStats() {
      const total = productsData.length;
      const active = productsData.filter(p => p.isActive !== false).length;
      const hidden = total - active;
      const cloudinaryCount = productsData.filter(p => p.cloudinaryPublicId).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statHidden').textContent = hidden;
      document.getElementById('statCloudinary').textContent = cloudinaryCount;
    }

    // Preview File Selection
    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        const box = document.getElementById('previewBox');
        box.innerHTML = `<img src="${selectedBase64Image}" alt="Preview">`;
      };
      reader.readAsDataURL(file);
    }

    // Open Add Modal
    function openAddModal() {
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('modalHeading').textContent = 'ADD NEW PERFUME';
      document.getElementById('previewBox').innerHTML = '<span style="font-size:0.7rem; color:var(--cream-muted);">NO IMAGE</span>';
      document.getElementById('displayOrder').value = productsData.length + 1;
      selectedBase64Image = null;
      document.getElementById('productModal').classList.add('active');
    }

    // Open Edit Modal
    function openEditModal(id) {
      const p = productsData.find(item => item._id === id);
      if (!p) return;

      document.getElementById('productId').value = p._id;
      document.getElementById('modalHeading').textContent = 'EDIT PERFUME';
      document.getElementById('productName').value = p.productName || '';
      document.getElementById('sizeML').value = p.sizeML || '8ML';
      document.getElementById('family').value = p.family || '';
      document.getElementById('personality').value = p.personality || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('displayOrder').value = p.displayOrder || 1;
      document.getElementById('isActive').value = p.isActive !== false ? 'true' : 'false';

      if (p.notesPyramid) {
        document.getElementById('noteTop').value = p.notesPyramid.top || '';
        document.getElementById('noteHeart').value = p.notesPyramid.heart || '';
        document.getElementById('noteBase').value = p.notesPyramid.base || '';
      }

      document.getElementById('imageUrl').value = p.imageUrl || '';
      document.getElementById('cloudinaryPublicId').value = p.cloudinaryPublicId || '';

      const box = document.getElementById('previewBox');
      if (p.imageUrl) {
        box.innerHTML = `<img src="${p.imageUrl}" alt="Current Image">`;
      } else {
        box.innerHTML = '<span style="font-size:0.7rem; color:var(--cream-muted);">NO IMAGE</span>';
      }

      selectedBase64Image = null;
      document.getElementById('productModal').classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    // Save Product (Add or Edit)
    async function handleSaveProduct(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveProductBtn');
      saveBtn.textContent = 'SAVING...';
      saveBtn.disabled = true;

      try {
        let finalImageUrl = document.getElementById('imageUrl').value;
        let finalPublicId = document.getElementById('cloudinaryPublicId').value;

        // If new image file selected, upload to Cloudinary
        if (selectedBase64Image) {
          saveBtn.textContent = 'UPLOADING IMAGE...';
          const uploadRes = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: selectedBase64Image, folder: 'ruhi-perfumes/products' })
          });
          const uploadData = await uploadRes.json();

          if (uploadRes.ok && uploadData.success) {
            finalImageUrl = uploadData.url;
            finalPublicId = uploadData.public_id;
            showToast('Image uploaded to Cloudinary!');
          } else {
            showToast(uploadData.error || 'Failed to upload image.', true);
            saveBtn.textContent = 'SAVE PRODUCT';
            saveBtn.disabled = false;
            return;
          }
        }

        const id = document.getElementById('productId').value;
        const payload = {
          id: id || undefined,
          productName: document.getElementById('productName').value,
          sizeML: document.getElementById('sizeML').value,
          family: document.getElementById('family').value,
          personality: document.getElementById('personality').value,
          description: document.getElementById('description').value,
          displayOrder: parseInt(document.getElementById('displayOrder').value, 10) || 1,
          isActive: document.getElementById('isActive').value === 'true',
          imageUrl: finalImageUrl,
          cloudinaryPublicId: finalPublicId,
          notesPyramid: {
            top: document.getElementById('noteTop').value,
            heart: document.getElementById('noteHeart').value,
            base: document.getElementById('noteBase').value,
          }
        };

        const method = id ? 'PUT' : 'POST';
        const res = await fetch('/api/products', {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showToast(id ? 'Product updated successfully.' : 'Product created successfully.');
          closeProductModal();
          loadAdminProducts();
        } else {
          showToast(data.error || 'Failed to save product.', true);
        }
      } catch (err) {
        showToast('Error saving product.', true);
      } finally {
        saveBtn.textContent = 'SAVE PRODUCT';
        saveBtn.disabled = false;
      }
    }

    // Delete Product Modal
    function openDeleteModal(id, name) {
      pendingDeleteId = id;
      document.getElementById('deleteConfirmText').textContent = `Are you sure you want to permanently delete "${name}"? This action will remove the database record and delete its Cloudinary image.`;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      document.getElementById('deleteModal').classList.remove('active');
    }

    async function confirmDeleteProduct() {
      if (!pendingDeleteId) return;

      try {
        const res = await fetch(`/api/products?id=${pendingDeleteId}`, {
          method: 'DELETE'
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Product permanently deleted.');
          closeDeleteModal();
          loadAdminProducts();
        } else {
          showToast(data.error || 'Could not delete product.', true);
        }
      } catch (err) {
        showToast('Error requesting deletion.', true);
      }
    }
  </script>
</body>
</html>
